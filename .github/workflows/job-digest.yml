name: Daily Job Search Digest

on:
  schedule:
    # 12:53 UTC = 7:53 AM EST (winter) / 8:53 AM EDT (summer)
    - cron: '53 12 * * *'
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/job-posting-digest-6pcrvg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/joshopp07/joshoppenheimer.com.git

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run job digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude --dangerously-skip-permissions -p "$(cat job-search/PROMPT.md)"

      - name: Check for today's results
        id: check
        run: |
          TODAY=$(date +%Y-%m-%d)
          echo "date=${TODAY}" >> $GITHUB_OUTPUT
          if [ -f "job-search/results/${TODAY}.md" ]; then
            echo "has_results=true" >> $GITHUB_OUTPUT
          else
            echo "has_results=false" >> $GITHUB_OUTPUT
          fi

      - name: Send digest email
        if: steps.check.outputs.has_results == 'true'
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESULTS_DATE: ${{ steps.check.outputs.date }}
        run: |
          python3 - <<'EOF'
          import smtplib, os
          from email.mime.text import MIMEText

          date = os.environ['RESULTS_DATE']
          username = os.environ['GMAIL_USERNAME']
          password = os.environ['GMAIL_APP_PASSWORD']

          with open(f'job-search/results/{date}.md') as f:
              body = f.read()

          msg = MIMEText(body, 'plain')
          msg['Subject'] = f'Job Digest — {date}'
          msg['From'] = f'Job Digest <{username}>'
          msg['To'] = username
          msg['Reply-To'] = username

          with smtplib.SMTP_SSL('smtp.gmail.com', 465) as server:
              server.login(username, password)
              server.send_message(msg)
          print('Email sent successfully')
          EOF
