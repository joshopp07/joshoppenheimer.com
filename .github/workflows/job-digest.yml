name: Email Job Digest

# The Claude cloud routine "Digital Health Job Posting Digest" does the research
# each morning and pushes job-search/results/YYYY-MM-DD.md to the digest branch.
# This workflow only emails that file; it does not run Claude.
on:
  push:
    branches: [claude/job-posting-digest-6pcrvg]
    paths: ['job-search/results/**']
  workflow_dispatch:
    inputs:
      date:
        description: 'Results date to email (YYYY-MM-DD); blank = newest file'
        required: false
        default: ''

jobs:
  email:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/job-posting-digest-6pcrvg
          fetch-depth: 0

      - name: Pick results files
        id: pick
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ -n "${BEFORE}" ] \
             && [ "${BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            files=$(git diff --name-only --diff-filter=AM "${BEFORE}" "${AFTER}" -- 'job-search/results/*.md')
          elif [ -n "${INPUT_DATE:-}" ]; then
            files="job-search/results/${INPUT_DATE}.md"
          else
            files=$(ls job-search/results/*.md | sort | tail -1)
          fi
          for f in ${files}; do
            [ -f "$f" ] || { echo "::error::Results file not found: $f"; exit 1; }
          done
          echo "files=$(echo ${files})" >> "$GITHUB_OUTPUT"
          echo "Emailing: ${files:-<none>}"

      - name: Install markdown renderer
        if: steps.pick.outputs.files != ''
        run: pip install --quiet markdown

      - name: Send digest email
        if: steps.pick.outputs.files != ''
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FILES: ${{ steps.pick.outputs.files }}
        run: |
          python3 - <<'EOF'
          import os
          import smtplib
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from pathlib import Path

          import markdown

          # Secrets pasted into the GitHub UI can carry stray whitespace; app
          # passwords are displayed by Google with spaces between groups.
          username = os.environ['GMAIL_USERNAME'].strip()
          password = ''.join(os.environ['GMAIL_APP_PASSWORD'].split())

          with smtplib.SMTP_SSL('smtp.gmail.com', 465) as server:
              server.login(username, password)
              for path in os.environ['FILES'].split():
                  body = Path(path).read_text()
                  date = Path(path).stem
                  msg = MIMEMultipart('alternative')
                  msg['Subject'] = f'Job Digest — {date}'
                  msg['From'] = f'Job Digest <{username}>'
                  msg['To'] = username
                  msg.attach(MIMEText(body, 'plain', 'utf-8'))
                  msg.attach(MIMEText(markdown.markdown(body), 'html', 'utf-8'))
                  server.send_message(msg)
                  print(f'Sent {path}')
          EOF
