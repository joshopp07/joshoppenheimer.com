name: Email Job Digest

# The Claude cloud routine "Digital Health Job Posting Digest" does the research
# each morning and pushes job-search/results/YYYY-MM-DD.md to the digest branch.
# This workflow only emails that file; it does not run Claude.
on:
  push:
    branches: [claude/job-posting-digest-6pcrvg]
    paths: ['job-search/results/**']
  workflow_dispatch:
    inputs:
      date:
        description: 'Results date to email (YYYY-MM-DD); blank = newest file'
        required: false
        default: ''

jobs:
  email:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/job-posting-digest-6pcrvg
          fetch-depth: 0

      - name: Pick results files
        id: pick
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ -n "${BEFORE}" ] \
             && [ "${BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            files=$(git diff --name-only --diff-filter=AM "${BEFORE}" "${AFTER}" -- 'job-search/results/*.md')
          elif [ -n "${INPUT_DATE:-}" ]; then
            files="job-search/results/${INPUT_DATE}.md"
          else
            files=$(ls job-search/results/*.md | sort | tail -1)
          fi
          for f in ${files}; do
            [ -f "$f" ] || { echo "::error::Results file not found: $f"; exit 1; }
          done
          echo "files=$(echo ${files})" >> "$GITHUB_OUTPUT"
          echo "Emailing: ${files:-<none>}"

      - name: Install markdown renderer
        if: steps.pick.outputs.files != ''
        run: pip install --quiet markdown

      # Sent through Resend from josh@joshoppenheimer.com. The domain's own mail
      # is Microsoft 365 via GoDaddy; Resend's DNS records live on the send. and
      # resend._domainkey subdomains and leave the root MX and SPF untouched.
      # The recipient is a secret, not a variable, because this repo's Action
      # logs are public and only secrets are masked.
      - name: Send digest email
        if: steps.pick.outputs.files != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          FILES: ${{ steps.pick.outputs.files }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          import markdown

          SENDER = 'Job Digest <josh@joshoppenheimer.com>'
          api_key = os.environ['RESEND_API_KEY'].strip()
          recipients = [a.strip() for a in os.environ['DIGEST_TO'].split(',') if a.strip()]
          if not api_key or not recipients:
              raise SystemExit('RESEND_API_KEY and DIGEST_TO secrets must both be set')

          for path in os.environ['FILES'].split():
              body = Path(path).read_text()
              payload = {
                  'from': SENDER,
                  'to': recipients,
                  'reply_to': 'josh@joshoppenheimer.com',
                  'subject': f'Job Digest — {Path(path).stem}',
                  'text': body,
                  'html': markdown.markdown(body),
              }
              req = urllib.request.Request(
                  'https://api.resend.com/emails',
                  data=json.dumps(payload).encode(),
                  headers={
                      'Authorization': f'Bearer {api_key}',
                      'Content-Type': 'application/json',
                      'User-Agent': 'joshoppenheimer-job-digest',
                  },
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      print(f'Sent {path}: {json.load(resp)["id"]}')
              except urllib.error.HTTPError as e:
                  raise SystemExit(f'Resend rejected {path}: HTTP {e.code} {e.read().decode()}')
          EOF
